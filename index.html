<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>License Admin</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:980px;margin:0 auto;padding:18px;background:#f6f7f9;color:#111}
section{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}
input,select,button{font:inherit;padding:10px;margin:4px 0;border-radius:8px;border:1px solid #ccc}
input,select{width:100%;box-sizing:border-box}
button{cursor:pointer;background:#111;color:#fff;border:0;padding:10px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
pre{background:#111;color:#eee;border-radius:10px;padding:14px;white-space:pre-wrap;overflow:auto}
small{color:#666}
</style>
</head>
<body>
<h1>License Admin</h1>

<section>
  <h3>Connection</h3>
  <label>Worker URL</label>
  <input id="url" placeholder="https://license-api.example.workers.dev">
  <label>Admin token</label>
  <input id="token" type="password" placeholder="Bearer token value">
  <button onclick="health()">Test Worker</button>
</section>

<section>
  <h3>Generate licenses</h3>
  <div class="grid">
    <div><label>Count</label><input id="count" type="number" min="1" max="100" value="1"></div>
    <div><label>Type</label>
      <select id="type">
        <option value="free">free</option>
        <option value="daily">daily</option>
        <option value="weekly" selected>weekly</option>
        <option value="monthly">monthly</option>
        <option value="lifetime">lifetime</option>
      </select>
    </div>
  </div>
  <label>Optional exact expiry</label>
  <input id="expires" type="datetime-local">
  <label>Note</label>
  <input id="note" placeholder="Optional note">
  <button onclick="generate()">Generate</button>
</section>

<section>
  <h3>Manage</h3>
  <input id="key" placeholder="LICENSE-KEY">
  <div class="grid">
    <button onclick="getLicense()">Get license</button>
    <button onclick="revoke()">Revoke</button>
    <button onclick="resetHwid()">Reset HWID</button>
    <button onclick="listLicenses()">List licenses</button>
  </div>
</section>

<section>
  <h3>Output</h3>
  <pre id="out">Ready.</pre>
</section>

<script>
const $ = id => document.getElementById(id);

function config(){
  return {
    url: $("url").value.trim().replace(/\/+$/,""),
    token: $("token").value.trim()
  };
}

async function call(path, options={}){
  const c = config();
  if(!c.url) throw new Error("Enter Worker URL first");
  const headers = {
    "content-type":"application/json",
    "authorization":"Bearer "+c.token,
    ...(options.headers||{})
  };
  const r = await fetch(c.url+path,{...options,headers});
  const text = await r.text();
  let data;
  try { data = JSON.parse(text); } catch { data = {raw:text}; }
  $("out").textContent = JSON.stringify({http:r.status,data},null,2);
  return data;
}

async function health(){
  const c=config();
  const r=await fetch(c.url+"/api/health");
  const d=await r.json();
  $("out").textContent=JSON.stringify({http:r.status,data:d},null,2);
}

function generate(){
  const e=$("expires").value;
  return call("/admin/generate",{
    method:"POST",
    body:JSON.stringify({
      count:Number($("count").value||1),
      type:$("type").value,
      expiresAt:e?new Date(e).toISOString():"",
      note:$("note").value
    })
  });
}

function getLicense(){
  return call("/admin/get?key="+encodeURIComponent($("key").value.trim()));
}

function revoke(){
  return call("/admin/revoke",{
    method:"POST",
    body:JSON.stringify({key:$("key").value.trim()})
  });
}

function resetHwid(){
  return call("/admin/reset-hwid",{
    method:"POST",
    body:JSON.stringify({key:$("key").value.trim()})
  });
}

function listLicenses(){
  return call("/admin/list?pageSize=100");
}
</script>
</body>
</html>
